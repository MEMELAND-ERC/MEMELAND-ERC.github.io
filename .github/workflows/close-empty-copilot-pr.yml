name: Close Empty Copilot PRs

# Defensive guard: if a Copilot branch PR has no file changes against base,
# close it automatically and explain why.

on:
  workflow_run:
    workflows: ["Running Copilot cloud agent"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  close-empty:
    if: startsWith(github.event.workflow_run.head_branch, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Close PR when no files changed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const branch = run.head_branch;

            if (!branch) {
              core.notice('No head branch on workflow_run payload; skipping.');
              return;
            }

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branch}`,
                per_page: 100
              }
            );

            if (prs.length === 0) {
              core.notice(`No open PR found for branch ${branch}; skipping.`);
              return;
            }

            for (const pr of prs) {
              const prNumber = pr.number;
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100
                }
              );

              if (files.length > 0) {
                core.info(`PR #${prNumber} has ${files.length} changed files; leaving open.`);
                continue;
              }

              const body = [
                "This PR was auto-closed because it contains no file changes compared to the base branch.",
                "",
                "Likely cause: the agent created only a placeholder commit (for example, `Initial plan`) but did not commit implementation changes.",
                "",
                "Please re-run the issue automation after ensuring the non-empty diff guard passes before PR creation."
              ].join("\n");

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                state: "closed"
              });

              core.notice(`Closed empty Copilot PR #${prNumber}.`);
            }
