name: Assign issue to Copilot (manual)

# Manual maintainer override: assigns one issue to the GitHub Copilot coding
# agent regardless of its readiness labels (it still skips closed issues and
# issues that Copilot is already assigned to).
#
# Normal issues do NOT need this: copilot-readiness-check.yml assigns Copilot
# automatically as soon as an issue passes the readiness check.
#
# Run it from the Actions tab ("Run workflow") or with:
#   gh workflow run copilot-assign.yml -f issue_number=<N>
#
# It requires a Personal Access Token (PAT) stored as COPILOT_TRIGGER_PAT.
# The built-in GITHUB_TOKEN cannot assign copilot-swe-agent[bot]; a real user
# token from someone with a Copilot seat is required. The same secret is used
# by copilot-readiness-check.yml and copilot-empty-pr-watchdog.yml.
#
# How to create the PAT (classic token is simplest):
#   1. Sign in as @OndrejMottl (must have an active Copilot seat)
#   2. Go to Settings → Developer settings → Personal access tokens → Tokens (classic)
#   3. Click "Generate new token (classic)"
#   4. Select the "repo" scope (covers issues, pull_requests, contents, actions)
#   5. Copy the token and add it as a repository secret named COPILOT_TRIGGER_PAT
#      (Repository Settings → Secrets and variables → Actions → New repository secret)
#
# If using a fine-grained PAT instead, it needs ALL of the following:
#   - Metadata: Read-only
#   - Actions: Read and write
#   - Contents: Read and write
#   - Issues: Read and write
#   - Pull requests: Read and write
# (Missing any one of these will cause a 403 error.)
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to assign to Copilot"
        required: true
        type: number

permissions: {}

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assign issue to Copilot coding agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_TRIGGER_PAT }}
          script: |
            const assignCopilot = require('./.github/scripts/assign-copilot.js');
            await assignCopilot({
              github,
              context,
              core,
              issueNumber: Number(context.payload.inputs.issue_number),
              force: true,
            });
