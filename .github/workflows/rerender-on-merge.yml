name: Re-render site after merge

# Runs whenever something is pushed to main (normally a merged PR).
# This is the ONLY place where docs/ (the published site) is generated and
# committed. PRs change source files only and never commit docs/.
# Renders with the exact Quarto version pinned in QUARTO_VERSION.
# The commit produced by this workflow is tagged [no-render] so it does
# not trigger another run of this workflow. Do not use [no-render] when
# merging content changes, or the site will not be updated.

on:
  push:
    branches:
      - main

# If several PRs are merged in quick succession, cancel the older run: the
# newest run renders the latest main, which includes all of them.
concurrency:
  group: rerender-main
  cancel-in-progress: true

jobs:
  rerender:
    # Skip the commit that this workflow itself produces to avoid infinite loops.
    if: "!contains(github.event.head_commit.message, '[no-render]')"

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install pinned Quarto (QUARTO_VERSION)
        run: |
          REQUIRED=$(tr -d '[:space:]' < QUARTO_VERSION)
          wget -q "https://github.com/quarto-dev/quarto-cli/releases/download/v${REQUIRED}/quarto-${REQUIRED}-linux-amd64.deb"
          sudo dpkg -i "quarto-${REQUIRED}-linux-amd64.deb"
          quarto --version

      - name: Render English
        run: quarto render --profile english

      - name: Render German
        run: quarto render --profile german

      - name: Render French
        run: quarto render --profile french

      - name: Render Czech
        run: quarto render --profile czech

      - name: Render Norwegian
        run: quarto render --profile norwegian

      - name: Create root redirect to English version
        run: |
          cat <<'EOF' > docs/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta http-equiv="refresh" content="0; url=en/index.html" />
              <link rel="canonical" href="https://memeland-erc.github.io/en/index.html" />
              <title>Redirecting to English version...</title>
            </head>
            <body>
              <p>If you are not redirected automatically, <a href="en/index.html">click here</a>.</p>
            </body>
          </html>
          EOF

      - name: Commit updated docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Only commit if docs/ actually changed after re-render
          if git diff --cached --quiet; then
            echo "No changes in docs/ — nothing to commit."
          else
            git commit -m "chore: re-render site after merge [no-render]"
            git push origin main
          fi
