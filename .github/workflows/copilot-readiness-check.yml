name: Copilot issue readiness check

# Checks every MEMELAND template issue and, once it is complete, assigns it
# to the GitHub Copilot coding agent, which then opens a PR.
#
# 1. `readiness` (GITHUB_TOKEN): sets `🤖 ready-for-copilot` or
#    `❓ status:needs-info` and keeps one status comment up to date so the
#    submitter knows what is missing.
# 2. `assign` (COPILOT_TRIGGER_PAT): assigns Copilot when the issue is ready.
#    This is done here, not by a separate `labeled` workflow, because label
#    changes made with GITHUB_TOKEN never trigger other workflows.
# 3. `report-failure`: comments on the issue if the assignment fails
#    (for example an expired COPILOT_TRIGGER_PAT).
#
# New comments (from people, on issues only) also run the check:
#   - A maintainer comment starting with `/assign-copilot` starts Copilot
#     without the check (the issue thread is the agent's context).
#   - Other maintainer comments are ignored.
#   - A comment from anyone else on an issue labelled `❓ status:needs-info`
#     re-runs the check. The check reads only the issue text, so if it still
#     fails, the bot hands the issue to the maintainer with a new comment
#     (which sends a notification) instead of stalling silently.
#
# Media requests are not started automatically: image rights cannot be
# confirmed by a checkbox. A complete media request gets `🤖 ready-for-copilot`
# and one comment asking the maintainer to check the images and reply
# `/assign-copilot`.
#
# `⏸️ no-agent` opts an issue out. Maintainers can also start Copilot by hand
# with the "Assign issue to Copilot (manual)" workflow (copilot-assign.yml).

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  readiness-check:
    # Comments on pull requests and comments by bots (this workflow's own
    # status comments, Copilot) must not run the check.
    if: >-
      github.event_name == 'issues' ||
      (!github.event.issue.pull_request && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-readiness-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Evaluate issue readiness
        id: readiness
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-readiness-check.js');
            const result = await run({ github, context, core });
            const assign = result.forceAssign ||
              (result.ready && !result.maintainerStart && !result.optedOut && !result.closed);
            core.setOutput('assign', String(assign));
            core.setOutput('force', String(Boolean(result.forceAssign)));

      - name: Assign issue to Copilot coding agent
        id: assign
        if: steps.readiness.outputs.assign == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_TRIGGER_PAT }}
          script: |
            const assignCopilot = require('./.github/scripts/assign-copilot.js');
            await assignCopilot({
              github,
              context,
              core,
              issueNumber: context.payload.issue.number,
              force: '${{ steps.readiness.outputs.force }}' === 'true',
            });

      - name: Report assignment failure
        if: failure() && steps.assign.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '⚠️ This request is complete, but the website assistant could not be started automatically.',
                '',
                `@OndrejMottl please check the [workflow run](${runUrl}). A common cause is an expired \`COPILOT_TRIGGER_PAT\` secret. After fixing it, start Copilot with the "Assign issue to Copilot (manual)" workflow.`,
              ].join('\n'),
            });
